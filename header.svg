<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <defs>
    <!-- Dark AI Native Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0c0c11" />
      <stop offset="100%" stop-color="#08080c" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b066fe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Neural Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Glow for Text/Lines -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" fill-opacity="0.08" />
    </pattern>

    <!-- Core Hub Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b066fe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="900" height="250" fill="url(#bgGlow)" rx="12" />
  <rect width="900" height="250" fill="url(#grid)" rx="12" />

  <!-- Advanced Architectural Gateway Graphic -->
  <g transform="translate(700, 125)">
    <!-- Ambient Core Glow -->
    <circle cx="0" cy="0" r="110" fill="url(#coreGlow)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="55" fill="url(#neonCyan)" opacity="0.15" filter="url(#glow)"/>

    <!-- Orbital Rings (Deterministic Bounds) -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#neonPurple)" stroke-width="1.5" opacity="0.3" stroke-dasharray="2 12" stroke-linecap="round"/>
    
    <!-- Outer Network Nodes (AI Agents) -->
    <path d="M -110 -40 L -50 -20 L 0 -60 L 50 -30 L 120 -50" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" opacity="0.35"/>
    <path d="M -100 50 L -40 20 L 0 60 L 60 20 L 130 40" fill="none" stroke="url(#neonPurple)" stroke-width="1.5" opacity="0.35"/>
    
    <!-- Central Deterministic Gateway (Hexagon) -->
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="none" stroke="#00f2fe" stroke-width="2" filter="url(#subtleGlow)" opacity="0.8"/>
    <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="url(#neonPurple)" opacity="0.6" filter="url(#subtleGlow)"/>

    <!-- High-Concurrency Data Streams -->
    <!-- Input Streams -->
    <path d="M -160 0 C -100 0, -60 -14, -24 -14" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.6" filter="url(#subtleGlow)"/>
    <path d="M -160 20 C -100 20, -60 14, -24 14" fill="none" stroke="#b066fe" stroke-width="2" opacity="0.6" filter="url(#subtleGlow)"/>
    
    <!-- Output Streams -->
    <path d="M 24 -14 C 60 -14, 90 -35, 140 -35" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.5"/>
    <path d="M 24 14 C 60 14, 90 0, 140 0" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25" stroke-dasharray="3 3"/>
    <path d="M 0 28 C 30 55, 70 45, 130 55" fill="none" stroke="#b066fe" stroke-width="1.5" opacity="0.5"/>

    <!-- Dynamic Inflight Packets -->
    <circle cx="-110" cy="-6" r="3" fill="#ffffff" filter="url(#subtleGlow)"/>
    <circle cx="-80" cy="17" r="3" fill="#ffffff" filter="url(#subtleGlow)"/>
    <circle cx="70" cy="-22" r="2.5" fill="#00f2fe"/>
    <circle cx="90" cy="48" r="2.5" fill="#b066fe"/>

    <!-- Routing Hub Intersections -->
    <circle cx="-50" cy="-20" r="3" fill="#00f2fe" filter="url(#subtleGlow)"/>
    <circle cx="0" cy="-60" r="3" fill="#b066fe" filter="url(#subtleGlow)"/>
    <circle cx="50" cy="-30" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="-40" cy="20" r="3" fill="#b066fe" filter="url(#subtleGlow)"/>
    <circle cx="0" cy="60" r="3" fill="#00f2fe" filter="url(#subtleGlow)"/>
    <circle cx="60" cy="20" r="3" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <g transform="translate(60, 95)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      黄飞虹 <tspan fill="#656d76" font-size="34" font-weight="500">(hrygo)</tspan>
    </text>
    <text y="38" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="15" font-weight="600" fill="url(#neonCyan)" letter-spacing="2">
      AI INFRASTRUCTURE ARCHITECT
    </text>
    <text y="75" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="14" font-style="italic">
      <tspan font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="normal" fill="url(#neonCyan)" dy="6">“</tspan>
      <tspan fill="#e6edf3" opacity="0.9" dy="-6"> Intelligence is non-deterministic. Infrastructure shouldn't be. </tspan>
      <tspan font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="normal" fill="url(#neonPurple)" dy="6">”</tspan>
    </text>
    <text y="100" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="400" fill="#8b949e" opacity="0.9">
      Architecting gateways, multimodal pipelines, and autonomous agent workflows.
    </text>
  </g>

  <!-- Status indicator -->
  <g transform="translate(60, 215)">
    <circle cx="5" cy="-4" r="4.5" fill="#3fb950" filter="url(#subtleGlow)" />
    <text x="18" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="12" font-weight="500" fill="#656d76" letter-spacing="0.5">SYSTEMS ONLINE // MULTI-AGENT ROUTING ACTIVE</text>
  </g>
</svg>
