<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <defs>
    <!-- Dark AI Native Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0c0c11" />
      <stop offset="100%" stop-color="#08080c" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b066fe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Neural Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Glow for Text/Lines -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="900" height="250" fill="url(#bgGlow)" rx="12" />
  <rect width="900" height="250" fill="url(#grid)" rx="12" />

  <!-- Abstract AI Nodes & Routing Path (Representing Gateways) -->
  <g transform="translate(680, 125)" stroke-width="1.5" fill="none">
    <!-- Glowing background blurs for AI depth -->
    <circle cx="0" cy="0" r="80" fill="url(#neonPurple)" opacity="0.15" filter="url(#glow)"/>
    <circle cx="-100" cy="-40" r="60" fill="url(#neonCyan)" opacity="0.15" filter="url(#glow)"/>
    <circle cx="80" cy="50" r="50" fill="#3fb950" opacity="0.08" filter="url(#glow)"/>
    
    <!-- Connection lines -->
    <path d="M -150 0 C -80 0, -40 -60, 0 -60" stroke="url(#neonCyan)" opacity="0.4" />
    <path d="M -150 0 C -80 0, -40 60, 0 60" stroke="url(#neonPurple)" opacity="0.4" />
    <path d="M 0 -60 C 50 -60, 70 -10, 120 -10" stroke="url(#neonCyan)" opacity="0.3" />
    <path d="M 0 60 C 50 60, 70 10, 120 10" stroke="url(#neonPurple)" opacity="0.3" />

    <!-- Core Nodes -->
    <circle cx="-150" cy="0" r="6" fill="#ffffff" filter="url(#subtleGlow)"/>
    <circle cx="-150" cy="0" r="16" stroke="#ffffff" opacity="0.2" />
    
    <circle cx="0" cy="-60" r="5" fill="url(#neonCyan)" filter="url(#subtleGlow)"/>
    <circle cx="0" cy="60" r="5" fill="url(#neonPurple)" filter="url(#subtleGlow)"/>
    
    <circle cx="120" cy="-10" r="3.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="120" cy="10" r="3.5" fill="#ffffff" opacity="0.8"/>

    <!-- Data Packets -->
    <circle cx="-80" cy="-33" r="2.5" fill="#00f2fe" filter="url(#subtleGlow)"/>
    <circle cx="-60" cy="48" r="2.5" fill="#b066fe" filter="url(#subtleGlow)"/>
    <circle cx="45" cy="-45" r="2" fill="#00f2fe" filter="url(#subtleGlow)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(60, 95)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      黄飞虹 <tspan fill="#656d76" font-size="34" font-weight="500">(hrygo)</tspan>
    </text>
    <text y="40" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="15" font-weight="600" fill="url(#neonCyan)" letter-spacing="2">
      AI INFRASTRUCTURE ARCHITECT
    </text>
    <text y="78" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="400" fill="#8b949e" opacity="0.9">
      Bridging non-deterministic AI models with highly-reliable systems.
    </text>
    <text y="100" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="400" fill="#8b949e" opacity="0.9">
      Architecting gateways, multimodal pipelines, and autonomous agent workflows.
    </text>
  </g>

  <!-- Status indicator -->
  <g transform="translate(60, 215)">
    <circle cx="5" cy="-4" r="4.5" fill="#3fb950" filter="url(#subtleGlow)" />
    <text x="18" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="12" font-weight="500" fill="#656d76" letter-spacing="0.5">SYSTEMS ONLINE // MULTI-AGENT ROUTING ACTIVE</text>
  </g>
</svg>
