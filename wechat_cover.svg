<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Dark AI Native Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0c0c11" />
      <stop offset="100%" stop-color="#08080c" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b066fe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Neural Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Glow for Text/Lines -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.03" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" fill-opacity="0.08" />
    </pattern>

    <!-- Core Hub Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b066fe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyber Rainbow "黄飞虹" Gradient -->
    <linearGradient id="flyingRainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D020" /> <!-- 黄 (Gold/Yellow) -->
      <stop offset="35%" stop-color="#FF1493" /> <!-- Cyber Pink -->
      <stop offset="70%" stop-color="#b066fe" /> <!-- Neon Purple -->
      <stop offset="100%" stop-color="#00f2fe" /> <!-- Neon Cyan -->
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1080" height="1080" fill="url(#bgGlow)" />
  <rect width="1080" height="1080" fill="url(#grid)" />

  <!-- Typography (Centered at top) -->
  <g transform="translate(540, 300)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="76" font-weight="800" letter-spacing="-0.5">
      <tspan fill="url(#flyingRainbow)">黄飞虹</tspan> <tspan fill="#656d76" font-size="52" font-weight="500">(hrygo)</tspan>
    </text>
    <text y="75" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="24" font-weight="600" fill="url(#neonCyan)" letter-spacing="4">
      AI INFRASTRUCTURE ARCHITECT
    </text>
    <text y="160" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="20" font-style="italic">
      <tspan font-family="Georgia, 'Times New Roman', serif" font-size="44" font-style="normal" fill="url(#neonCyan)" dy="12">“</tspan>
      <tspan fill="#e6edf3" opacity="0.9" dy="-12"> Intelligence is non-deterministic. Infrastructure shouldn't be. </tspan>
      <tspan font-family="Georgia, 'Times New Roman', serif" font-size="44" font-style="normal" fill="url(#neonPurple)" dy="12">”</tspan>
    </text>
  </g>

  <!-- Advanced Architectural Graphic: Chaos to Order -->
  <!-- Scaled up and centered vertically below the text -->
  <g transform="translate(540, 680) scale(2.4)">
    
    <!-- 1. NON-DETERMINISTIC AI (The Left Side - Chaos & Neural Fluidity) -->
    <g opacity="0.7">
      <circle cx="-140" cy="0" r="50" fill="url(#neonPurple)" filter="url(#glow)" opacity="0.25"/>
      <circle cx="-90" cy="-20" r="40" fill="url(#neonCyan)" filter="url(#glow)" opacity="0.2"/>
      
      <!-- Chaotic, organic neural paths (Cubic Beziers) -->
      <path d="M -220 15 C -180 80, -140 -60, -90 -10 C -70 10, -60 -20, -50 -10" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" filter="url(#subtleGlow)"/>
      <path d="M -210 -25 C -170 -10, -160 60, -110 20 C -90 5, -70 40, -50 15" fill="none" stroke="url(#neonPurple)" stroke-width="1.5" filter="url(#subtleGlow)"/>
      <path d="M -200 -40 C -150 -60, -120 40, -80 0 C -70 -10, -60 10, -50 5" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5" filter="url(#subtleGlow)"/>
      
      <!-- Organic Neural Nodes -->
      <circle cx="-138" cy="18" r="2.5" fill="#00f2fe" filter="url(#subtleGlow)"/>
      <circle cx="-125" cy="-26" r="2" fill="#ffffff"/>
      <circle cx="-85" cy="14" r="3" fill="#b066fe" filter="url(#subtleGlow)"/>
      <circle cx="-75" cy="-8" r="1.5" fill="#ffffff"/>
    </g>

    <!-- 2. THE BOUNDARY (The Gateway / Infrastructure Shield) -->
    <g transform="translate(-50, 0)">
      <!-- Gateway Energy Field -->
      <ellipse cx="10" cy="0" rx="15" ry="55" fill="url(#neonCyan)" opacity="0.08" filter="url(#glow)"/>
      
      <!-- Rigid Bracket Firewall -->
      <path d="M 0 -50 L 10 -50 L 10 50 L 0 50" fill="none" stroke="#00f2fe" stroke-width="2.5" filter="url(#subtleGlow)"/>
      <path d="M -6 -35 L 0 -35 L 0 35 L -6 35" fill="none" stroke="#b066fe" stroke-width="1.5" opacity="0.7"/>
      
      <!-- State Machine Ports -->
      <circle cx="10" cy="-25" r="3.5" fill="#ffffff" filter="url(#subtleGlow)"/>
      <circle cx="10" cy="0" r="4.5" fill="#00f2fe" filter="url(#subtleGlow)"/>
      <circle cx="10" cy="25" r="3.5" fill="#b066fe" filter="url(#subtleGlow)"/>
    </g>

    <!-- 3. DETERMINISTIC INFRASTRUCTURE (The Right Side - Order & Stability) -->
    <g opacity="0.8" transform="translate(-40, 0)">
      <!-- Strict, parallel PCB-like traces -->
      <!-- Top Track -->
      <path d="M 10 -25 L 50 -25 L 65 -40 L 130 -40" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
      <circle cx="130" cy="-40" r="2" fill="#00f2fe" filter="url(#subtleGlow)"/>
      <circle cx="90" cy="-40" r="1.5" fill="#ffffff"/>

      <!-- Center Track -->
      <path d="M 10 0 L 140 0" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5" stroke-dasharray="6 4"/>
      <polygon points="140,-3 146,0 140,3" fill="#ffffff" opacity="0.6"/>
      
      <!-- Bottom Track -->
      <path d="M 10 25 L 40 25 L 55 45 L 100 45 L 115 30 L 130 30" fill="none" stroke="#b066fe" stroke-width="1.5"/>
      <circle cx="130" cy="30" r="2" fill="#b066fe" filter="url(#subtleGlow)"/>
      <circle cx="70" cy="45" r="1.5" fill="#ffffff"/>

      <!-- Synchronization Pulses (Vertical) -->
      <line x1="100" y1="-50" x2="100" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.1" stroke-dasharray="2 3"/>
      <line x1="120" y1="-20" x2="120" y2="35" stroke="#00f2fe" stroke-width="1" opacity="0.15"/>
    </g>
  </g>

  <!-- Status indicator -->
  <g transform="translate(540, 980)" text-anchor="middle">
    <!-- Offset the circle manually relative to the text length -->
    <circle cx="-190" cy="-4" r="6" fill="#3fb950" filter="url(#subtleGlow)" />
    <text x="0" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="16" font-weight="500" fill="#656d76" letter-spacing="1">SYSTEMS ONLINE // MULTI-AGENT ROUTING ACTIVE</text>
  </g>
</svg>
